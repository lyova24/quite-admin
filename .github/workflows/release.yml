name: release
on:
  push:
    tags: ['v*']
  release:
    types: [published]
permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Resolve the tagged commit
        id: commit
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require full master CI and its documentation artifact
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
        with:
          script: |
            const check = require('./scripts/check-ci.cjs');
            return await check({github, context, sha: process.env.RELEASE_SHA, docs: true});
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
          python-version: '3.12'
      - run: uv run --no-project python scripts/check_release.py --tag "$RELEASE_TAG"

  publish:
    if: github.event_name == 'push'
    needs: metadata
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
          python-version: '3.12'
      - run: uv run --no-project python scripts/check_release.py --tag "$RELEASE_TAG" --notes release-notes.md
      - name: Publish release with changelog; GitHub supplies source archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
        run: |
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha')" = "$RELEASE_SHA"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "Quite Admin $RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Quite Admin $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
