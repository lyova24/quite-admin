name: pages

on:
  workflow_run:
    workflows: [release]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'release') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      ci-run-id: ${{ steps.ci.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Require successful master CI for the released commit
        id: ci
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const check = require('./scripts/check-ci.cjs');
            return await check({github, context, sha: process.env.RELEASE_SHA, docs: true});

  prepare:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Download the documentation built and tested by CI
        uses: actions/download-artifact@v4
        with:
          name: quite-admin-docs
          path: build/docs
          run-id: ${{ needs.verify.outputs.ci-run-id }}
          github-token: ${{ github.token }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/docs

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the release documentation
        id: deployment
        uses: actions/deploy-pages@v4
