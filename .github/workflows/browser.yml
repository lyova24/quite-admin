name: browser
on: [workflow_call, workflow_dispatch]
permissions:
  contents: read

jobs:
  browser:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            os: ubuntu-latest
            workers: 2
          - browser: firefox
            os: ubuntu-latest
            workers: 2
          - browser: webkit
            os: macos-latest
            workers: 1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps ${{ matrix.browser }}
      - run: npm run browser:test -- --project=${{ matrix.browser }} --workers=${{ matrix.workers }}
        env:
          DEBUG: pw:webserver
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
