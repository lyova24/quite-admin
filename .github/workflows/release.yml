name: release
on:
  push:
    tags: ['v*']
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python scripts/check_release.py --tag "$RELEASE_TAG"
      - run: uv run ruff check src tests examples scripts/check_release.py
      - run: uv run pytest -q

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
          python-version: '3.12'
      - run: uv run --no-project python scripts/check_release.py --tag "$RELEASE_TAG" --notes release-notes.md
      - run: uv build
      - run: uvx --from 'twine>=6,<7' twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: |
            dist/
            release-notes.md
          if-no-files-found: error

  github-draft:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
      - name: Create a draft release with changelog and distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --title "$RELEASE_TAG" --notes-file release-notes.md

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
      - uses: pypa/gh-action-pypi-publish@release/v1
