{% from "quite_admin/_icons.html" import filter_icon %}
{% macro add_filter_button(show_label=false) %}<button class="button secondary{% if not show_label %} icon-button{% endif %} filter-add" type="button" data-filter-add title="{{ t('Add filter') }}" aria-label="{{ t('Add filter') }}" hidden>{{ filter_icon() }}{% if show_label %}{{ t('Add filter') }}{% endif %}</button>{% endmacro %}
{% macro condition_chips(conditions, clear_url) %}{% for item in conditions %}<span class="filter-chip filter-condition"><span class="filter-label">{{ item.label }}</span><button class="filter-edit" type="button" data-filter-edit="{{ loop.index0 }}" hidden>{{ item.label }}</button><a class="filter-remove" href="{{ item.remove_url }}" aria-label="{{ t('Remove') }}: {{ item.label }}">×</a></span>{% endfor %}<a class="link-button" href="{{ clear_url }}">{{ t('Clear all') }}</a>{% endmacro %}
