name: pages

on:
  workflow_run:
    workflows: [release, ci]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      ((github.event.workflow_run.name == 'release' &&
        (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'release')) ||
       (github.event.workflow_run.name == 'ci' && github.event.workflow_run.head_branch == 'master' &&
        (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    outputs:
      ci-run-id: ${{ steps.ci.outputs.result }}
      deploy: ${{ steps.target.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select released or documentation-only changes
        id: target
        uses: actions/github-script@v7
        env:
          DOCS_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            if (context.payload.workflow_run.name === 'release') return true;
            const check = require('./scripts/check-docs-deployment.cjs');
            return await check({github, context, sha: process.env.DOCS_SHA, info: core.info});
      - name: Require full master CI for the exact documentation commit
        if: steps.target.outputs.result == 'true'
        id: ci
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const check = require('./scripts/check-ci.cjs');
            const runId = await check({github, context, sha: process.env.RELEASE_SHA, docs: true});
            if (context.payload?.workflow_run?.name === 'ci' && runId !== context.payload.workflow_run.id) {
              throw new Error('Only the latest successful master CI completion may deploy documentation.');
            }
            return runId;

  prepare:
    needs: verify
    if: needs.verify.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download the documentation built and tested by CI
        uses: actions/download-artifact@v4
        with:
          name: quite-admin-docs
          path: build/docs
          run-id: ${{ needs.verify.outputs.ci-run-id }}
          github-token: ${{ github.token }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/docs

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified documentation
        id: deployment
        uses: actions/deploy-pages@v4
