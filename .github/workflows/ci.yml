name: ci
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  databases:
    uses: ./.github/workflows/databases.yml
  compatibility:
    uses: ./.github/workflows/compatibility.yml
  security:
    uses: ./.github/workflows/security.yml
  ready:
    name: CI ready
    if: always()
    needs: [tests, databases, compatibility, security]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation group to succeed
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          results = json.loads(os.environ['CI_RESULTS'])
          failures = [name for name, job in results.items() if job['result'] != 'success']
          if failures:
              raise SystemExit('Required checks did not pass: ' + ', '.join(failures))
          PY
