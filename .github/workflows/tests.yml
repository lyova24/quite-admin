name: tests
on: [workflow_call, workflow_dispatch]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests examples scripts
      - run: uv run ruff format --check src tests examples scripts
      - run: uv run python scripts/check_release.py
      - run: uv run pytest -q
      - run: uv build
      - name: Install wheel and sdist in clean environments and exercise both frameworks
        if: matrix.python-version == '3.12'
        run: uv run --no-project python scripts/check_distributions.py

  logging-backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked --group logging-check
      - run: uv run --group logging-check python -c 'import picologging, structlog, loguru'
      - run: uv run --group logging-check pytest tests/test_logging.py -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - run: npm run demo:test
      - uses: actions/upload-artifact@v4
        with:
          name: quite-admin-docs
          path: build/docs
          if-no-files-found: error

  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps ${{ matrix.browser }}
      - run: npm run browser:test -- --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
