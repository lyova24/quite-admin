name: browser
on: [workflow_call, workflow_dispatch]
permissions:
  contents: read

jobs:
  browser:
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.container }}
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            os: ubuntu-latest
            workers: 2
            # Match @playwright/test; bundled system dependencies avoid apt downloads.
            container: mcr.microsoft.com/playwright:v1.64.1-noble
          - browser: firefox
            os: ubuntu-latest
            workers: 2
            container: mcr.microsoft.com/playwright:v1.64.1-noble
          - browser: webkit
            os: macos-latest
            workers: 1
            container: ''
    steps:
      - uses: actions/checkout@v4
      - name: Match the container home owner to the process user
        if: runner.os == 'Linux'
        # Firefox refuses to launch when HOME belongs to another user.
        run: chown "$(id -u):$(id -g)" "$HOME"
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - if: runner.os == 'macOS'
        run: npx --no-install playwright install --with-deps ${{ matrix.browser }}
      - run: npm run browser:test -- --project=${{ matrix.browser }} --workers=${{ matrix.workers }}
        env:
          DEBUG: pw:webserver
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
