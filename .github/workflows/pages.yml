name: pages

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  current:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      fresh: ${{ steps.head.outputs.fresh }}
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/github-script@v7
        id: head
        with:
          script: |
            const {data} = await github.rest.repos.getBranch({...context.repo, branch:'master'});
            const sha = context.payload.workflow_run?.head_sha || context.sha;
            const runs = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id:'ci.yml', head_sha:sha, per_page:100,
            });
            const verified = runs.data.workflow_runs.some(run =>
              run.head_sha === sha && run.conclusion === 'success');
            core.setOutput('fresh', String(data.commit.sha === sha && verified));
            core.setOutput('sha', sha);

  build:
    needs: current
    if: needs.current.outputs.fresh == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.current.outputs.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - run: npm run demo:test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/docs

  deploy:
    needs: [current, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/github-script@v7
        id: head
        env:
          TESTED_SHA: ${{ needs.current.outputs.sha }}
        with:
          script: |
            const {data} = await github.rest.repos.getBranch({...context.repo, branch:'master'});
            core.setOutput('fresh', String(data.commit.sha === process.env.TESTED_SHA));
      - name: Deploy Diplodoc
        if: steps.head.outputs.fresh == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
